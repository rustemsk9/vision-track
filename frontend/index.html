<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Engine Overlay</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #container { position: relative; width: 640px; height: 480px; margin: 0 auto; top: 10px; }
        video { position: absolute; top: 0; left: 0; width: 640px; height: 480px; object-fit: cover; z-index: 1; transform: scaleX(-1); border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; z-index: 2; pointer-events: none; border-radius: 8px; }
        #status { position: absolute; top: 10px; left: 10px; z-index: 3; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px; font-weight: bold; }
        #log-panel { position: absolute; bottom: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.85); color: #00ff88; font-family: monospace; font-size: 11px; padding: 8px 10px; border-radius: 6px; width: 420px; max-height: 130px; overflow-y: auto; border: 1px solid rgba(0,255,136,0.3); pointer-events: auto; }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="status">
            <div><strong>Status:</strong> <span id="status-text">Initializing...</span></div>
            <div><strong>FPS:</strong> <span id="fps">0</span></div>
            <div><strong>Engine:</strong> Three.js Instanced + WebGL</div>
        </div>
        <div id="log-panel">
            <div style="font-weight: bold; color: #fff; margin-bottom: 4px; display: flex; justify-space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 2px;">
                <span>📜 Web Engine Diagnostic Log</span>
                <button onclick="document.getElementById('log-content').innerHTML=''" style="background:#222;border:1px solid #444;color:#ccc;cursor:pointer;border-radius:3px;font-size:10px;padding:1px 5px;">Clear</button>
            </div>
            <div id="log-content"></div>
        </div>
    </div>

    <!-- Include Three.js and ONNX Runtime Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
