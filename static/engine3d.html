<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Engine Overlay</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #container { position: relative; width: 100%; height: 100vh; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #status { position: absolute; top: 10px; left: 10px; z-index: 3; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="status">
            <div><strong>Status:</strong> <span id="status-text">Initializing...</span></div>
            <div><strong>FPS:</strong> <span id="fps">0</span></div>
            <div><strong>Engine:</strong> Three.js Instanced + WebGL</div>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
// Phase 3 & 4: Web Architecture and 3D Visualization

const video = document.getElementById('webcam');
const statusText = document.getElementById('status-text');
const fpsText = document.getElementById('fps');

// Three.js setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('container').appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(0, 10, 5);
scene.add(directionalLight);

// Phase 4: Three.js Instanced Rendering for optimal performance
const jointCount = 17; // 17 points for a human pose skeleton
const geometry = new THREE.SphereGeometry(0.1, 16, 16);
const material = new THREE.MeshPhongMaterial({ color: 0x00ff88 });
const instancedMesh = new THREE.InstancedMesh(geometry, material, jointCount);
scene.add(instancedMesh);

camera.position.z = 5;

async function getWebcamStream(constraints = { video: { width: 640, height: 480 } }) {
    if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
        return await navigator.mediaDevices.getUserMedia(constraints);
    }
    
    const legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
    if (legacyGetUserMedia) {
        return new Promise((resolve, reject) => {
            legacyGetUserMedia.call(navigator, constraints, resolve, reject);
        });
    }

    if (!window.isSecureContext) {
        throw new Error("Webcam access requires a Secure Context (e.g. http://localhost:8501 or HTTPS). Modern browsers block camera access on insecure origins like http://" + window.location.hostname);
    } else {
        throw new Error("Camera API (navigator.mediaDevices.getUserMedia) is not supported by your browser or camera permission was denied.");
    }
}

// Initialize WebRTC and Engine
async function initEngine() {
    try {
        statusText.innerText = "Requesting Webcam...";
        const stream = await getWebcamStream({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        video.play().catch(() => {});
        
        statusText.innerText = "Loading ONNX YOLOv11-nano & WASM Math...";
        // Simulate loading models and compiling WASM
        setTimeout(() => {
            statusText.innerText = "Running 3D GCN Inference (Simulated)";
            startRenderLoop();
        }, 1500);

    } catch (err) {
        statusText.innerText = "Error: " + err.message;
        console.error(err);
    }
}

let lastTime = 0;
let frames = 0;

function startRenderLoop() {
    const dummy = new THREE.Object3D();
    
    function animate(time) {
        requestAnimationFrame(animate);
        
        // Calculate FPS
        frames++;
        if (time - lastTime >= 1000) {
            fpsText.innerText = frames;
            frames = 0;
            lastTime = time;
        }

        // Phase 4: Matrix Buffer Updates 
        // Here we simulate the (X, Y, Z) output from the Node D GCN
        // In reality, this would be read from the WASM/WebGL buffer output
        const t = time * 0.002;
        for (let i = 0; i < jointCount; i++) {
            dummy.position.set(
                Math.sin(t + i * 0.2) * 2,
                Math.cos(t * 1.5 + i * 0.1) * 2,
                Math.sin(t * 0.5 + i * 0.3) * 1
            );
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
        }
        instancedMesh.instanceMatrix.needsUpdate = true;

        renderer.render(scene, camera);
    }
    
    requestAnimationFrame(animate);
}

// Handle window resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start the engine
initEngine();

</script>
</body>
</html>
