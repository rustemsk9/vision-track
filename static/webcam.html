<!DOCTYPE html>
<html>
<head>
    <title>Edge AI Webcam</title>
    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: white; font-family: sans-serif; }
        #container { position: relative; width: 640px; height: 480px; margin: 0 auto; top: 20px; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; }
        #status { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="status">
            <div id="status-text">Initializing Webcam...</div>
        </div>
    </div>
    <script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status-text');

// Fixed to 640x640 to match static ONNX graph input shape [1, 3, 640, 640]
const MODEL_SIZE = 640;
const offscreenCanvas = document.createElement('canvas');
offscreenCanvas.width = MODEL_SIZE;
offscreenCanvas.height = MODEL_SIZE;
const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

const tensorData = new Float32Array(1 * 3 * MODEL_SIZE * MODEL_SIZE);
const inv255 = 1.0 / 255.0;

let session;
let isInferring = false;
let latestBoxes = [];
let lastInferenceTimeMs = 0;
let currentFps = 0;
let fpsCounter = 0;
let fpsTimer = performance.now();

async function getWebcamStream(constraints = { video: { width: 640, height: 480 } }) {
    if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
        return await navigator.mediaDevices.getUserMedia(constraints);
    }
    
    const legacyGetUserMedia = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia;
    if (legacyGetUserMedia) {
        return new Promise((resolve, reject) => {
            legacyGetUserMedia.call(navigator, constraints, resolve, reject);
        });
    }

    if (!window.isSecureContext) {
        throw new Error("Webcam access requires a Secure Context (e.g. http://localhost:8501 or HTTPS). Modern browsers block camera access on insecure origins like http://" + window.location.hostname);
    } else {
        throw new Error("Camera API (navigator.mediaDevices.getUserMedia) is not supported by your browser or camera permission was denied.");
    }
}

async function initWebcam() {
    try {
        statusText.innerText = "Requesting Webcam Permission...";
        const stream = await getWebcamStream({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        video.play().catch(() => {});
        
        video.onloadedmetadata = async () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            statusText.innerText = "Downloading YOLO Model (12MB). Please wait...";
            
            // Enable SIMD hardware vector acceleration
            ort.env.wasm.simd = true;
            
            // Auto-detect multi-threading support (4 CPU threads on supported browsers)
            if (typeof SharedArrayBuffer !== 'undefined') {
                ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 4);
            } else {
                ort.env.wasm.numThreads = 1;
            }
            
            ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/';
            
            const modelUrl = '/static/yolov8n.onnx';
            const response = await fetch(modelUrl, { cache: 'force-cache' });
            const arrayBuffer = await response.arrayBuffer();
            
            if (arrayBuffer.byteLength < 10000) {
                throw new Error("Model file too small (" + arrayBuffer.byteLength + " bytes). The download was likely truncated by the browser.");
            }
            
            console.log("[Edge AI] Model downloaded successfully: " + (arrayBuffer.byteLength / 1024 / 1024).toFixed(1) + " MB");
            const modelBytes = new Uint8Array(arrayBuffer);
            
            // Try WebGPU first for native GPU compute shaders, fallback to WebGL and WASM SIMD
            session = await ort.InferenceSession.create(modelBytes, { 
                executionProviders: ['webgpu', 'webgl', 'wasm'] 
            });
            
            statusText.innerText = "Edge AI Active! (60 FPS Overlay)";
            setTimeout(() => { 
                const st = document.getElementById('status');
                if (st) st.style.display = 'none';
            }, 3000);
            
            // Start smooth rendering loop and non-blocking inference worker loop
            requestAnimationFrame(renderLoop);
            setInterval(triggerInference, 10);
        };
    } catch (e) {
        statusText.innerText = "Error: " + e.message;
        console.error(e);
    }
}

function preprocess(imageBuffer) {
    const size = MODEL_SIZE * MODEL_SIZE;
    const size2 = size * 2;
    for (let i = 0; i < size; i++) {
        const i4 = i * 4;
        tensorData[i] = imageBuffer[i4] * inv255;
        tensorData[i + size] = imageBuffer[i4 + 1] * inv255;
        tensorData[i + size2] = imageBuffer[i4 + 2] * inv255;
    }
    return new ort.Tensor('float32', tensorData, [1, 3, MODEL_SIZE, MODEL_SIZE]);
}

function computeIOU(box1, box2) {
    const x1 = Math.max(box1.x1, box2.x1);
    const y1 = Math.max(box1.y1, box2.y1);
    const x2 = Math.min(box1.x2, box2.x2);
    const y2 = Math.min(box1.y2, box2.y2);
    
    if (x2 < x1 || y2 < y1) return 0.0;
    
    const intersection = (x2 - x1) * (y2 - y1);
    const area1 = (box1.x2 - box1.x1) * (box1.y2 - box1.y1);
    const area2 = (box2.x2 - box2.x1) * (box2.y2 - box2.y1);
    
    return intersection / (area1 + area2 - intersection);
}

async function triggerInference() {
    if (isInferring || !session || !video.videoWidth) return;
    isInferring = true;

    try {
        const tStart = performance.now();

        // 1. Draw video frame to 640x640 offscreen canvas
        offscreenCtx.drawImage(video, 0, 0, MODEL_SIZE, MODEL_SIZE);
        const imgData = offscreenCtx.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
        
        // 2. Preprocess to tensor [1, 3, 640, 640]
        const input = preprocess(imgData.data);
        
        // 3. Run Inference directly inside browser GPU/WASM sandbox
        const feeds = {};
        feeds[session.inputNames[0]] = input;
        const results = await session.run(feeds);
        
        const output = results[session.outputNames[0]].data; // [1, 84, 8400]
        const num_anchors = Math.floor(output.length / 84);
        
        // 4. Filter Person Class (Index 4)
        let boxes = [];
        for (let i = 0; i < num_anchors; i++) {
            let person_score = output[4 * num_anchors + i];
            if (person_score > 0.45) {
                let cx = output[0 * num_anchors + i];
                let cy = output[1 * num_anchors + i];
                let w = output[2 * num_anchors + i];
                let h = output[3 * num_anchors + i];
                boxes.push({
                    x1: cx - w / 2,
                    y1: cy - h / 2,
                    x2: cx + w / 2,
                    y2: cy + h / 2,
                    score: person_score
                });
                if (boxes.length >= 100) break;
            }
        }
        
        // Non-Maximum Suppression (NMS)
        boxes.sort((a, b) => b.score - a.score);
        let finalBoxes = [];
        for (let b of boxes) {
            let keep = true;
            for (let f of finalBoxes) {
                if (computeIOU(b, f) > 0.45) {
                    keep = false;
                    break;
                }
            }
            if (keep) finalBoxes.push(b);
        }
        
        latestBoxes = finalBoxes;
        lastInferenceTimeMs = performance.now() - tStart;
    } catch (err) {
        console.error("Inference Error:", err);
    } finally {
        isInferring = false;
    }
}

function renderLoop() {
    requestAnimationFrame(renderLoop);

    if (!video.videoWidth) return;

    // Calculate Smooth UI Render FPS
    const now = performance.now();
    fpsCounter++;
    if (now - fpsTimer >= 1000) {
        currentFps = Math.round((fpsCounter * 1000) / (now - fpsTimer));
        fpsCounter = 0;
        fpsTimer = now;
    }

    // 5. Draw Bounding Boxes Overlay smoothly at 60 FPS
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const scaleX = canvas.width / (MODEL_SIZE * 1.0);
    const scaleY = canvas.height / (MODEL_SIZE * 1.0);
    
    for (let b of latestBoxes) {
        const px1 = b.x1 * scaleX;
        const py1 = b.y1 * scaleY;
        const pw = (b.x2 - b.x1) * scaleX;
        const ph = (b.y2 - b.y1) * scaleY;
        
        ctx.strokeStyle = '#00FF00';
        ctx.lineWidth = 4;
        ctx.strokeRect(px1, py1, pw, ph);
        
        ctx.fillStyle = '#00FF00';
        ctx.font = '20px Arial';
        ctx.fillText("Person: " + (b.score * 100).toFixed(0) + "%", px1, py1 - 10);
    }
    
    ctx.fillStyle = '#00FF00';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(`⚡ Edge AI (640p): ${currentFps} UI FPS | AI Latency: ${lastInferenceTimeMs.toFixed(1)} ms`, 20, 35);
    
    ctx.fillStyle = '#FF0000';
    ctx.font = '22px Arial';
    ctx.fillText("Total People: " + latestBoxes.length, 20, 65);
}

// Start
initWebcam();

</script>
</body>
</html>
